<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lety, tus flores amarillas 🌻</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at center, #2e1700 0%, #0a0500 100%);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif; color: #fff; text-align: center;
        }

        #intro {
            position: absolute; z-index: 50; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: all 1s ease;
        }
        .btn-flower {
            background: linear-gradient(145deg, #ffcc00, #ff8800);
            border: none; width: 140px; height: 140px; border-radius: 50%;
            font-size: 5rem; cursor: pointer;
            box-shadow: 0 0 40px rgba(255, 170, 0, 0.6);
            animation: breathe 2s infinite ease-in-out;
            display: flex; align-items: center; justify-content: center;
        }
        .tap-text {
            margin-top: 30px; font-size: 1.3rem; font-weight: 600; color: #ffcc00;
            text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.8); animation: pulseText 1.5s infinite alternate;
        }

        #content {
            position: relative; z-index: 10; display: flex; flex-direction: column;
            align-items: center; justify-content: center; opacity: 0; transform: scale(0.5);
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
        }
        #content.active { opacity: 1; transform: scale(1); pointer-events: auto; }

        .main-emojis { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }
        .draggable {
            font-size: 4.5rem; cursor: grab; touch-action: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
        }
        .draggable:active { cursor: grabbing; transform: scale(1.15); }
        .draggable:nth-child(2) { font-size: 5.5rem; }

        h1 {
            font-size: 2.8rem; font-weight: 800; color: #ffdd00;
            text-shadow: 0 0 30px rgba(255, 221, 0, 0.7); padding: 0 20px;
        }

        #again-btn {
            position: fixed; bottom: 35px; z-index: 100;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none; padding: 12px 30px; border-radius: 30px;
            font-size: 1.1rem; font-weight: bold; color: #000; cursor: pointer;
            box-shadow: 0 5px 25px rgba(255,215,0,0.6);
            opacity: 0; pointer-events: none; transition: opacity 1s ease;
        }
        #again-btn.show { opacity: 1; pointer-events: auto; }

        .particle { position: absolute; pointer-events: none; z-index: 1; animation: fall linear forwards; }

        @keyframes breathe {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(255, 170, 0, 0.6); }
            50% { transform: scale(1.1); box-shadow: 0 0 80px rgba(255, 170, 0, 1); }
        }
        @keyframes pulseText { from { opacity: 0.4; } to { opacity: 1; } }
        @keyframes fall {
            0% { transform: translate(var(--startX), -50px) rotate(0deg) scale(var(--scale)); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate(var(--endX), 110vh) rotate(var(--rot)) scale(var(--scale)); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="intro" onclick="startMagic()">
        <button class="btn-flower">🌻</button>
        <div class="tap-text">Tócala</div>
    </div>

    <div id="content">
        <div class="main-emojis">
            <span class="draggable">🌻</span>
            <span class="draggable">🐹</span>
            <span class="draggable">🌻</span>
        </div>
        <h1>Lety, tus flores amarillas</h1>
    </div>

    <button id="again-btn" onclick="location.reload()">Otra vez 🌻</button>

    <script>
        const emojis = ['🌻', '🐹', '✨', '💛', '🌼'];

        function createParticle(isExplosion = false) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            const startX = isExplosion ? '50vw' : Math.random() * 100 + 'vw';
            const endX = (Math.random() * 100) + 'vw';
            const scale = Math.random() * 0.8 + 0.8;
            const rot = Math.random() * 360 + 'deg';
            const duration = isExplosion ? (Math.random() * 2 + 3) : (Math.random() * 4 + 4);
            
            p.style.setProperty('--startX', isExplosion ? '0px' : startX);
            p.style.setProperty('--endX', isExplosion ? (Math.random() * 200 - 100 + 'vw') : endX);
            p.style.setProperty('--scale', scale);
            p.style.setProperty('--rot', rot);
            
            p.style.left = isExplosion ? '50%' : startX;
            p.style.top = isExplosion ? '50%' : '-50px';
            p.style.fontSize = (Math.random() * 1.5 + 1.5) + 'rem';
            p.style.animationDuration = duration + 's';
            
            document.body.appendChild(p);
            setTimeout(() => p.remove(), duration * 1000);
        }

        function startMagic() {
            const intro = document.getElementById('intro');
            const content = document.getElementById('content');
            
            intro.style.transform = 'scale(2.5)';
            intro.style.opacity = '0';
            
            // Efecto prolongado de explosión masiva (dura más tiempo)
            for(let i = 0; i < 90; i++) {
                setTimeout(() => createParticle(true), i * 40);
            }

            setTimeout(() => {
                intro.style.display = 'none';
                content.classList.add('active');
                
                // Lluvia constante
                setInterval(() => createParticle(false), 200);

                // Mostrar botón de "Otra vez" a los 40 segundos exactos
                setTimeout(() => {
                    document.getElementById('again-btn').classList.add('show');
                }, 40000);

            }, 2500);
        }

        // Hacer elementos arrastrables con el dedo o ratón
        document.querySelectorAll('.draggable').forEach(el => {
            let isDragging = false, startX, startY, initialX, initialY;

            el.addEventListener('pointerdown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                const rect = el.getBoundingClientRect();
                initialX = rect.left;
                initialY = rect.top;
                el.setPointerCapture(e.pointerId);
                el.style.position = 'fixed';
                el.style.left = initialX + 'px';
                el.style.top = initialY + 'px';
            });

            el.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                el.style.left = (initialX + dx) + 'px';
                el.style.top = (initialY + dy) + 'px';
            });

            el.addEventListener('pointerup', (e) => {
                isDragging = false;
                el.releasePointerCapture(e.pointerId);
            });
        });
    </script>
</body>
</html>
